<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Secure Notepad Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Links to your Flask static folder -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=2.0">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <i class="fa fa-file-text"></i>
            <span>Secure</span>
            <span class="brand-notes">Notepad</span>
        </div>
        <div class="header-right">
            <!-- Example user logout route -->
            <a href="{{ url_for('logout') }}" title="Logout">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
            </a>
            <i class="fa-regular fa-circle-user"></i>
        </div>
    </header>

    <!-- Main Content -->
    <div class="app-container">
        
        <!-- Left Sidebar: Folders -->
        <aside class="sidebar-left">
            <ul class="folder-list">
                <a href="{{ url_for('dashboard') }}" class="folder-item active">
                    <i class="fa-regular fa-folder"></i> All Notes
                </a>
            </ul>
            <button class="new-folder-btn" onclick="document.getElementById('new-note-form').submit();">
                <i class="fa-solid fa-circle-plus"></i> New Note
            </button>
        </aside>

        <!-- Middle Sidebar: Note List -->
        <aside class="sidebar-middle">
            <div class="search-container">
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Search all notes">
                </div>
            </div>
            
            <ul class="notes-list">
                <!-- Jinja Loop for Database Notes -->
                {% for note in notes %}
                <a href="{{ url_for('dashboard', note_id=note.id) }}" class="note-card">
                    <div class="note-card-title">{{ note.title or 'Untitled Note' }}</div>
                    <div class="note-card-preview">
                        <span class="note-card-date">{{ note.date_created }}</span>
                    </div>
                </a>
                {% else %}
                <div style="padding: 20px; text-align: center; color: var(--text-secondary); font-size: 14px;">
                    No notes yet. Create one!
                </div>
                {% endfor %}
            </ul>
        </aside>

        <!-- Right Panel: Editor -->
        <main class="editor-pane">
            <!-- Form to handle saving to MySQL via Flask -->
            <form id="editor-form" action="{{ url_for('save_note') }}" method="POST" style="display: flex; flex-direction: column; flex: 1;">
                
                <!-- Hidden ID field for updating existing notes -->
                <input type="hidden" name="note_id" value="{{ current_note.id if current_note else '' }}">
                
                <div class="editor-toolbar">
                    <div class="toolbar-left">
                        {% if current_note %}
                        <a href="{{ url_for('delete_note', note_id=current_note.id) }}" style="color: var(--accent-yellow);">
                            <i class="fa-regular fa-trash-can"></i>
                        </a>
                        {% endif %}
                    </div>
                    <div class="toolbar-center">
                        <span style="font-weight: bold; font-family: serif; font-size: 16px; cursor: pointer;">Aa</span>
                        <i class="fa-solid fa-list-check"></i>
                    </div>
                    <div class="toolbar-right">
                        <!-- Save Button -->
                        <button type="submit" title="Save Note">
                            <i class="fa-regular fa-floppy-disk"></i>
                        </button>
                    </div>
                </div>
                
                <div class="editor-content">
                    <input type="text" name="title" class="editor-title-input" placeholder="Title" value="{{ current_note.title if current_note else '' }}">
                    <textarea name="content" class="editor-textarea" placeholder="Start typing...">{{ current_note.content if current_note else '' }}</textarea>
                </div>
            </form>

            <!-- Hidden form for creating a new blank note quickly -->
            <form id="new-note-form" action="{{ url_for('create_note') }}" method="POST" style="display: none;"></form>

        </main>
    </div>

</body>
</html>
